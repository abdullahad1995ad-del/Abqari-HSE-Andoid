name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Android preparation files
        run: |
          unzip -o Abqari_HSE_Android_Prep_v3.zip -d prep

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build --if-present

      - name: Prepare www directory
        run: |
          mkdir -p www
          if [ -f dist/index.html ]; then
            cp -r dist/. www/
          elif [ -f index.html ]; then
            cp index.html www/
            for item in assets images css js fonts; do
              if [ -d "$item" ]; then
                cp -r "$item" www/
              fi
            done
          else
            echo "ERROR: index.html not found"
            exit 1
          fi
          test -f www/index.html

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abqari-HSE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
